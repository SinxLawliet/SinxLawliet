name: Update profile contribution card

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: seijikohara/profile-cards-action@v1
        with:
          github-token: ${{ secrets.PROFILE_TOKEN }}
          cards: contributions
          output-dir: assets
          themes: light,dark
          commit: true